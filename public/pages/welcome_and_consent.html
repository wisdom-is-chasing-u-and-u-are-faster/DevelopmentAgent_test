<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome & Consent — Digital Savings Account Opening</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="brand-container">
            <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 0.75rem; color: inherit;">
                <div class="brand-logo">🏦</div>
                <div class="brand-title">Enterprise Digital Bank</div>
            </a>
        </div>
        <div class="badge-stp">Step 1 of 6</div>
    </header>

    <div class="main-container">
        <div class="card-box">
            <h1 class="card-title">Welcome & Consent</h1>
            <p class="card-subtitle">Begin your Straight-Through Processing (STP) digital savings application.</p>

            <form id="standalone-consent-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required value="applicant@enterprise.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Mobile Phone</label>
                    <input type="tel" id="phone" class="form-control" required value="+15550192834">
                </div>
                <div class="form-group" style="margin: 1.5rem 0;">
                    <label style="display: flex; gap: 0.5rem; font-size: 0.875rem;">
                        <input type="checkbox" id="consent" checked required>
                        <span>I consent to identity verification and data processing under Bank Terms.</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Initialize Onboarding Session →</button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById("standalone-consent-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            try {
                await BankingAPI.createSession({ applicant_email: email, applicant_phone: phone, consent_given: true, terms_accepted: true, channel: "web" });
                window.location.href = "/pages/scan_identity_document.html";
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
