<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Personal Information — Digital Savings Account Opening</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="brand-container">
            <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 0.75rem; color: inherit;">
                <div class="brand-logo">🏦</div>
                <div class="brand-title">Enterprise Digital Bank</div>
            </a>
        </div>
        <div class="badge-stp">Step 3 of 6</div>
    </header>

    <div class="main-container">
        <div class="card-box">
            <h1 class="card-title">Verify Personal Information</h1>
            <p class="card-subtitle">Confirm OCR details and verify your SMS OTP code.</p>

            <form id="standalone-info-form">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="v-fname">First Name</label>
                        <input type="text" id="v-fname" class="form-control" value="Alexander" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="v-lname">Last Name</label>
                        <input type="text" id="v-lname" class="form-control" value="Hamilton" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="v-doc">Document Number</label>
                    <input type="text" id="v-doc" class="form-control" value="P987654321" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="v-addr">Residential Address</label>
                    <input type="text" id="v-addr" class="form-control" value="55 Wall Street, Suite 400" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="v-otp">SMS OTP Code</label>
                    <input type="text" id="v-otp" class="form-control" value="894210" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Confirm Details & Continue →</button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById("standalone-info-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const session = BankingAPI.getSession();
            try {
                await BankingAPI.verifyPersonalInfo({
                    session_id: session.session_id || "sess_demo_001",
                    first_name: document.getElementById("v-fname").value,
                    last_name: document.getElementById("v-lname").value,
                    document_number: document.getElementById("v-doc").value,
                    residential_address: document.getElementById("v-addr").value,
                    city: "New York",
                    postal_code: "10005",
                    otp_code: document.getElementById("v-otp").value
                });
                window.location.href = "/pages/biometric_liveness_check.html";
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
